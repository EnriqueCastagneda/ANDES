[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bcrp-downloader"
version = "1.1.0"
description = "Explorador y extractor de series estadísticas del Banco Central de Reserva del Perú (BCRP)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "BCRP Downloader contributors" }]
keywords = ["bcrp", "flet", "pandas", "series-temporales", "peru", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "flet==1.0.5",
    "pandas>=2.2",
    "requests>=2.31",
    "typer>=0.9",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.0"]
all = ["mcp>=1.2"]

[dependency-groups]
dev = [
    "flet-cli==1.0.5",
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.0",
]

[project.scripts]
bcrp = "bcrp_downloader.cli.main:app"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["bcrp_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.flet]
app.module = "app"
product = "BCRP Downloader"
artifact = "bcrp-downloader"
org = "com.bcrpdownloader"
company = "BCRP Downloader contributors"
copyright = "Copyright (C) 2026 BCRP Downloader contributors"
build_number = 1
