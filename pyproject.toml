[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "andes-open-data"
version = "2.0.1"
description = "ANDES — Open Data Platform: acceso, integración y descarga de estadísticas y datos abiertos del Perú."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ANDES contributors" }]

keywords = ["andes", "open-data", "estadisticas", "peru", "flet", "pandas", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "flet==1.0.5",
    "pandas>=2.2",
    "requests>=2.31",
    "xlrd>=2.0",
    "xlwt>=1.3",
    "openpyxl>=3.1",
    "typer>=0.9",
]

[project.urls]
Homepage = "https://github.com/EnriqueCastagneda/ANDES"
Repository = "https://github.com/EnriqueCastagneda/ANDES"
Issues = "https://github.com/EnriqueCastagneda/ANDES/issues"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.5", "build>=1.0", "websocket-client>=1.7", "pillow>=10"]
all = ["mcp>=1.2"]

[dependency-groups]
dev = [
    "flet-cli==1.0.5",
    "pytest>=8.0",
    "ruff>=0.5",
    "build>=1.0",
    "websocket-client>=1.7",
    "pillow>=10",
]

[project.scripts]
andes = "andes.cli.main:app"

[tool.setuptools]
py-modules = ["app"]

[tool.setuptools.packages.find]
include = ["andes*"]

[tool.setuptools.package-data]
andes = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.flet]
app.module = "app"
product = "ANDES"
artifact = "andes"
org = "com.andesplatform"
company = "ANDES contributors"
copyright = "Copyright (C) 2026 ANDES contributors"
build_number = 1
