name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publicar un release con los artefactos"
        type: boolean
        default: false
      release_tag:
        description: "Tag del release (p. ej. v1.0.0)"
        type: string
        default: "v1.0.0"
  push:
    tags: ["v*"]

jobs:
  build:
    name: build-${{ matrix.name }}
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux, target: linux, os: ubuntu-latest }
          - { name: windows, target: windows, os: windows-latest }
          - { name: macos, target: macos, os: macos-latest }
          - { name: apk, target: apk, os: ubuntu-latest }
          - { name: web, target: web, os: ubuntu-latest }
    steps:
      - uses: actions/checkout@v4

      - name: Calcular versión
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=1.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilar con Flet
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: .
          runner-python-version: "3.12"
          build-number: ${{ github.run_number }}
          build-version: ${{ steps.version.outputs.value }}
          archive-output: true

      - name: Normalizar artefacto
        id: pack
        shell: bash
        run: |
          mkdir -p dist-out
          ext=zip
          [ "${{ matrix.target }}" = "linux" ] && ext=tar.gz
          name="bcrp-downloader-${{ matrix.target }}-${{ steps.version.outputs.value }}.${ext}"
          src=$(find build -maxdepth 2 -type f \( -name '*.zip' -o -name '*.tar.gz' \) | head -n 1)
          if [ -z "$src" ]; then echo "No se encontró artefacto"; exit 1; fi
          cp "$src" "dist-out/$name"
          echo "path=dist-out/$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          path: ${{ steps.pack.outputs.path }}
          archive: false
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publicar release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
          else
            gh release create "${{ inputs.release_tag }}" artifacts/* \
              --generate-notes --target "$GITHUB_SHA"
          fi
