name: Build and release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publicar en PyPI (requiere el secreto PYPI_API_TOKEN)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  package:
    name: Package (sdist + wheel)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux
            os: ubuntu-latest
            timeout: 45
          - target: windows
            os: windows-latest
            timeout: 45
          - target: macos
            os: macos-latest
            timeout: 45
          - target: apk
            os: ubuntu-latest
            timeout: 90
          - target: web
            os: ubuntu-latest
            timeout: 45
    steps:
      - uses: actions/checkout@v5
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="2.0.2"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Smoke test without FTS5
        if: matrix.target == 'apk'
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest tests/test_catalog_fallback.py -q
      - name: Build with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: ${{ matrix.target }}
          working-directory: .
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          build-version: ${{ steps.version.outputs.version }}
          cache: true
          archive-output: true
      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p artifact
          if [[ "${{ matrix.target }}" == "linux" ]]; then EXT=".tar.gz"; else EXT=".zip"; fi
          cp "${{ steps.build.outputs.archive-path }}" \
             "artifact/andes-${{ matrix.target }}-${{ steps.version.outputs.version }}${EXT}"
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: andes-${{ matrix.target }}
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
      - name: Verify macOS app bundle structure
        if: matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          UNZIP_DIR=$(mktemp -d)
          unzip -q "${{ steps.build.outputs.archive-path }}" -d "$UNZIP_DIR"
          APP_DIR=$(find "$UNZIP_DIR" -maxdepth 1 -type d -name "*.app" -print -quit)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: .app directory missing in macOS bundle"
            exit 1
          fi
          if [ ! -f "$APP_DIR/Contents/MacOS/andes" ]; then
            echo "ERROR: Missing executable in Contents/MacOS"
            exit 1
          fi
          echo "✅ macOS app bundle verified: $APP_DIR"
      - name: Verify Linux bundle structure
        if: matrix.target == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          TARBALL="${{ steps.build.outputs.archive-path }}"
          # grep sin -q: consume toda la salida y evita SIGPIPE con pipefail.
          if ! tar -tzf "$TARBALL" | grep "^linux/andes$" > /dev/null; then
            echo "ERROR: Missing linux/andes launcher in tarball"
            exit 1
          fi
          if ! tar -tzf "$TARBALL" | grep "linux/app/andes/" > /dev/null; then
            echo "ERROR: Missing linux/app/andes/ python package in tarball"
            exit 1
          fi
          echo "✅ Linux bundle verified: $TARBALL"
      - name: Verify Windows bundle structure
        if: matrix.target == 'windows'
        shell: bash
        run: |
          set -euo pipefail
          ZIP="${{ steps.build.outputs.archive-path }}"
          if ! unzip -l "$ZIP" | grep "andes.exe" > /dev/null; then
            echo "ERROR: Missing andes.exe in windows archive"
            exit 1
          fi
          echo "✅ Windows bundle verified: $ZIP"
      - name: Verify Android APK exists
        if: matrix.target == 'apk'
        shell: bash
        run: |
          set -euo pipefail
          APK="${{ steps.build.outputs.archive-path }}"
          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found at $APK"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -E '\.apk$' > /dev/null; then
            echo "ERROR: No .apk file inside $APK"
            exit 1
          fi
          echo "✅ Android APK verified: $APK"
      - name: "Smoke test web (strategy A: client + backend)"
        if: matrix.target == 'web'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . websocket-client requests
          npx -y playwright install chromium
          export PLAYWRIGHT_BROWSERS_PATH="$HOME/.cache/ms-playwright"
          PORT=8551
          ANDES_OUTPUT_DIR="$PWD/outputs" python -m andes.cli.main gui --web --port "$PORT" \
            >/tmp/andes-web-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://127.0.0.1:${PORT}/" || true)
            [[ "$code" == "200" ]] && break
            sleep 1
          done
          python scripts/smoke_web.py --url "http://127.0.0.1:${PORT}/" --timeout 120

  publish-pypi:
    name: Publish to PyPI
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - name: Download dist
        uses: actions/download-artifact@v8
        with:
          name: python-dist
          path: dist
      - name: Publish
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ env.PYPI_API_TOKEN }}
          skip-existing: true
          attestations: false

  release:
    name: Publish GitHub release
    needs: [package, binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --generate-notes \
            --title "ANDES $GITHUB_REF_NAME"

  update-readme:
    name: Update README download links
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Regenerate download section
        run: python scripts/update_readme_downloads.py "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"
      - name: Commit and push
        run: |
          if git diff --quiet README.md; then
            echo "README sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update README download links for $GITHUB_REF_NAME"
          git pull --rebase origin main
          git push origin HEAD:main
